name: Adapter
description: Propose a vendor adapter behind a named port (no keys).
title: "adapter: vendor → port"
labels: ["adapter"]
body:
  - type: markdown
    attributes:
      value: |
        Paper-only. No live trading. **Do not paste API keys, cookies, or `.env` values.**
        Read [docs/SENSITIVE-INTEGRATIONS.md](https://github.com/fh2fcr42z2-glitch/helix-community/blob/main/docs/SENSITIVE-INTEGRATIONS.md) first.
  - type: dropdown
    id: port
    attributes:
      label: Port
      options:
        - Tape
        - SearchInterest
        - Chatter
        - WalletIdentity (gated)
        - CexFlow (gated)
        - EquitySip (gated)
        - OptionsFlow (gated)
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: vendor
    attributes:
      label: Vendor
      placeholder: CoinGecko, Helius, …
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      options:
        - Free / public
        - Optional / paid (bring-your-own key, private env)
    validations:
      required: true
  - type: textarea
    id: unlocks
    attributes:
      label: What it unlocks (one sentence)
      description: A research question, not a marketing line. Be honest if this stays DARK without a key.
    validations:
      required: true
  - type: textarea
    id: dark
    attributes:
      label: DARK / failure behavior
      description: What the adapter returns when the key is missing, the pair is missing, or the vendor 429s.
    validations:
      required: true
  - type: textarea
    id: mocks
    attributes:
      label: Mock plan
      description: What fixtures you will commit. CI must not need your laptop or a vendor account.
    validations:
      required: true
  - type: checkboxes
    id: pledges
    attributes:
      label: Pledges
      options:
        - label: I will not commit secrets or copy private helix-cx source.
          required: true
        - label: I will not add a live order path.
          required: true
