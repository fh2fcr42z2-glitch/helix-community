name: Docs
description: Fix a claim, mark a feed DARK, or improve public docs.
title: "docs: "
labels: ["docs"]
body:
  - type: markdown
    attributes:
      value: Do not paste secrets. If the doc over-claims a private capability, say so.
  - type: input
    id: path
    attributes:
      label: Path
      placeholder: docs/ARCHITECTURE.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
